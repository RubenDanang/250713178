<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
  "http://wwww.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="ID">
<head>
    <title>Switch Case: Menu Kantin</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <script type="text/javascript">
        var sInput = prompt("Pilih menu: (N)asi goreng, (M)ie ayam, (B)akso, (E)s teh", "N");

        switch (sInput) {
            case "N":
                alert("Anda memilih Nasi goreng.");
                break;
            case "M":
                alert("Anda memilih Mie ayam.");
                break;
            case "B":
                alert("Anda memilih Bakso.");
                break;
            case "E":
                alert("Anda memilih Es teh.");
                break;
            default:
                alert("Menu yang Anda pilih tidak tersedia.");
        }
    </script>
</head>

<body>
    <h1>Switch Case: Menu Kantin</h1>
    <p>Reload halaman untuk mencoba lagi.</p>
</body>
</html>
