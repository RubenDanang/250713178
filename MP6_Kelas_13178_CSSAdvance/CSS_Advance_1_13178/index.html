
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Formulir Pendaftaran Mahasiswa</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Formulir Pendaftaran Mahasiswa</h1>
            <p>
                Selamat datang! Silakan lengkapi formulir berikut
                untuk mengisi data diri mahasiswa.
            </p>
        </div>

        <form action="#" method="post">
            <h2>Data Mahasiswa</h2>

            <p class="description">
                Pastikan informasi yang kamu masukkan sudah benar
                agar proses pendataan berjalan dengan lancar.
            </p>

            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama"
                       placeholder="Masukkan nama lengkap"
                       required="required" />
            </div>

            <div class="form-group">
                <label for="nim">Nomor Induk Mahasiswa (NIM)</label>
                <input type="text" id="nim" name="nim"
                       placeholder="Masukkan NIM"
                       required="required" />
            </div>

            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="text" id="email" name="email"
                       placeholder="Masukkan alamat email"
                       required="required" />
            </div>

            <div class="form-group">
                <label for="prodi">Program Studi</label>
                <select id="prodi" name="prodi" required="required">
                    <option value="">-- Pilih Program Studi --</option>
                    <option value="Sistem Informasi">Sistem Informasi</option>
                    <option value="Informatika">Informatika</option>
                    <option value="Teknik Industri">Teknik Industri</option>
                    <option value="Manajemen">Manajemen</option>
                    <option value="Akuntansi">Akuntansi</option>
                </select>
            </div>

            <div class="form-group">
                <label for="angkatan">Tahun Angkatan</label>
                <select id="angkatan" name="angkatan"
                        required="required">
                    <option value="">-- Pilih Tahun Angkatan --</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jenis Kelamin</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="jenis_kelamin"
                               value="Laki-laki" required="required" />
                        Laki-laki
                    </label>

                    <label>
                        <input type="radio" name="jenis_kelamin"
                               value="Perempuan" />
                        Perempuan
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Tempat Tinggal</label>
                <textarea id="alamat" name="alamat" rows="4"
                          placeholder="Masukkan alamat lengkap"
                          required="required"></textarea>
            </div>

            <div class="agreement">
                <label>
                    <input type="checkbox" name="persetujuan"
                           value="setuju" required="required" />
                    Saya memastikan data yang diisi sudah benar.
                </label>
            </div>

            <button type="submit">Kirim Pendaftaran</button>
            <button type="reset" class="reset">Hapus Isian</button>

            <p class="footer">
                Terima kasih telah melengkapi data mahasiswa.
            </p>
        </form>
    </div>
</body>
</html>
