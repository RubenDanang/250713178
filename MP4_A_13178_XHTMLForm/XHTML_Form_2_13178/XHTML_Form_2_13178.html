<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
</head>
<body>
    <h1>Formulir Pendaftaran Seminar</h1>
    <form action="" method="post" enctype="multipart/form-data">

        <!-- Tabel Data Peserta -->
        <p><strong>Data Peserta</strong></p>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="nama"><strong>Nama Lengkap</strong></label>
                </td>
                <td>
                    <input type="text" id="nama" name="nama" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="nim"><strong>NIM</strong></label>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-laki" /><label for="laki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" /><label for="perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="prodi"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <!-- Tabel Pilihan Seminar -->
        <p><strong>Pilihan Seminar</strong></p>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="radio" id="reguler" name="tiket" value="Reguler" /><label for="reguler">Reguler</label>
                    <input type="radio" id="vip" name="tiket" value="VIP" /><label for="vip">VIP</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="topik1" name="topik" value="Web Development" /><label for="topik1">Web Development</label><br />
                        <input type="checkbox" id="topik2" name="topik" value="Data Science" /><label for="topik2">Data Science</label><br />
                        <input type="checkbox" id="topik3" name="topik" value="Artificial Intelligence" /><label for="topik3">Artificial Intelligence</label>
                    </p>
                </td>
            </tr>
        </table>

        <!-- Tabel Informasi Tambahan -->
        <p><strong>Informasi Tambahan</strong></p>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="alasan"><strong>Alasan Mengikuti Seminar</strong></label>
                </td>
                <td>
                    <textarea id="alasan" name="alasan" rows="10" cols="23"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="bukti"><strong>Bukti Pembayaran</strong></label>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="simpan" value="Simpan" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
